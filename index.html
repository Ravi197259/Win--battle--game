<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Win Battle</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      text-align: center;
    }

    .game {
      max-width: 450px;
      margin: auto;
      padding: 25px 15px;
    }

    h1 {
      margin-top: 20px;
    }

    .coins {
      font-size: 24px;
      margin: 20px;
    }

    .card {
      background: #1f2937;
      padding: 25px;
      border-radius: 20px;
      margin-top: 20px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin: 8px 0;
      border: none;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    #message {
      min-height: 30px;
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

<div class="game">

  <h1>🏆 Win Battle</h1>

  <div class="coins">
    🪙 Coins: <span id="coins">100</span>
  </div>

  <div class="card">

    <h2 id="question">Question</h2>

    <button onclick="answer(0)" id="a0"></button>
    <button onclick="answer(1)" id="a1"></button>
    <button onclick="answer(2)" id="a2"></button>
    <button onclick="answer(3)" id="a3"></button>

    <div id="message"></div>

  </div>

  <button onclick="newGame()">🔄 New Game</button>

</div>

<script>

let coins = 100;
let currentQuestion = 0;

const questions = [

  {
    q: "भारत की राजधानी क्या है?",
    options: ["मुंबई", "दिल्ली", "जयपुर", "पटना"],
    correct: 1
  },

  {
    q: "2 + 2 कितना होता है?",
    options: ["3", "4", "5", "6"],
    correct: 1
  },

  {
    q: "भारत का राष्ट्रीय पशु कौन है?",
    options: ["शेर", "हाथी", "बाघ", "घोड़ा"],
    correct: 2
  },

  {
    q: "पृथ्वी का उपग्रह कौन है?",
    options: ["सूर्य", "चंद्रमा", "मंगल", "शुक्र"],
    correct: 1
  }

];

function loadQuestion() {

  let q = questions[currentQuestion];

  document.getElementById("question").innerText = q.q;

  for (let i = 0; i < 4; i++) {
    document.getElementById("a" + i).innerText = q.options[i];
  }

  document.getElementById("message").innerText = "";

}

function answer(index) {

  let q = questions[currentQuestion];

  if (index === q.correct) {

    coins += 20;

    document.getElementById("message").innerText =
      "🎉 सही जवाब! +20 Coins";

  } else {

    coins = Math.max(0, coins - 10);

    document.getElementById("message").innerText =
      "❌ गलत जवाब! -10 Coins";

  }

  document.getElementById("coins").innerText = coins;

  currentQuestion++;

  if (currentQuestion >= questions.length) {

    setTimeout(() => {

      alert(
        "🏆 Game Over!\n\nआपके Coins: " + coins
      );

      currentQuestion = 0;
      loadQuestion();

    }, 700);

  } else {

    setTimeout(loadQuestion, 700);

  }

}

function newGame() {

  coins = 100;
  currentQuestion = 0;

  document.getElementById("coins").innerText = coins;

  loadQuestion();

}

loadQuestion();

</script>

</body>
